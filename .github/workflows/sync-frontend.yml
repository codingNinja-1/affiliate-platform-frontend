name: Sync Frontend to affiliate-platform-frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affiliate-platform
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone affiliate-platform-frontend
        run: |
          git clone https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/codingNinja-1/affiliate-platform-frontend.git temp-frontend

      - name: Copy frontend files
        run: |
          cd temp-frontend
          # Remove all files EXCEPT .git
          find . -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          # Copy new files
          cp -r ../frontend/* .
          # Stage and commit
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "chore: sync frontend from affiliate-platform monorepo [skip ci]"
            git push
          else
            echo "No changes to sync"
          fi
