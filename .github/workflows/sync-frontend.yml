name: Sync Frontend to affiliate-platform-frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affiliate-platform
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to affiliate-platform-frontend
        uses: dmulholl/sync-directories@v1
        with:
          source: frontend
          destination: .
          repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/codingNinja-1/affiliate-platform-frontend.git
          commit-message: "chore: sync from affiliate-platform monorepo [skip ci]"
          user-name: "github-actions[bot]"
          user-email: "github-actions[bot]@users.noreply.github.com"
