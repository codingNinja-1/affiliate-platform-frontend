name: Sync Frontend to affiliate-platform-frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push frontend to affiliate-platform-frontend
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
        with:
          source-directory: 'frontend'
          destination-github-username: 'codingNinja-1'
          destination-repository-name: 'affiliate-platform-frontend'
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          commit-message: 'chore: sync from affiliate-platform monorepo [skip ci]'
