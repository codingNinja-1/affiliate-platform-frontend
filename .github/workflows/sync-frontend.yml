name: Sync Frontend to affiliate-platform-frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affiliate-platform
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone affiliate-platform-frontend
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/codingNinja-1/affiliate-platform-frontend.git temp-frontend

      - name: Copy frontend files
        run: |
          cd temp-frontend
          rm -rf *
          cp -r ../frontend/* .
          git add -A
          git commit -m "chore: sync frontend from affiliate-platform monorepo [skip ci]" || echo "No changes to commit"
          git push

      - name: Cleanup
        if: always()
        run: rm -rf temp-frontend
